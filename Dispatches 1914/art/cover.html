<!doctype html>
<meta charset="utf-8">
<title>Dispatches 1914 cover</title>
<style>
  /* Cover for the itch.io page: 630x500. Colours are the game's own palette (src/90-ui.jsx THEME). */
  :root{--paper:#f4efe2;--raised:#e9e2cf;--ink:#1c1a17;--soft:#5d574c;--accent:#7a2e2e}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper)}
  .cover{position:relative;width:630px;height:500px;overflow:hidden;background:var(--paper);color:var(--ink);
    font-family:"SFMono-Regular",Menlo,Consolas,"Courier New",monospace}
  .frame{position:absolute;inset:14px;border:2px solid var(--ink)}
  .frame:after{content:"";position:absolute;inset:5px;border:1px solid var(--ink)}
  .file{position:absolute;top:34px;left:40px;right:40px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.28em}
  .rule{position:absolute;left:40px;right:40px;border:0;border-top:1.5px solid var(--ink)}
  h1{position:absolute;left:40px;right:40px;top:96px;margin:0;font:700 30px Georgia,"Times New Roman",serif;letter-spacing:.34em}
  .year{position:absolute;left:34px;top:122px;font:700 150px/1 Georgia,"Times New Roman",serif;letter-spacing:.02em}
  .sub{position:absolute;left:40px;right:40px;top:272px;font-size:13px;letter-spacing:.16em;line-height:1.7;color:var(--soft)}
  .seals{position:absolute;left:34px;right:34px;top:372px;display:flex;justify-content:space-between}
  .seal{border:2.5px solid var(--accent);color:var(--accent);padding:7px 11px;font-size:13px;font-weight:700;letter-spacing:.2em;
    box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--accent);background:var(--paper)}
  .seal:nth-child(1){transform:rotate(-3deg)} .seal:nth-child(2){transform:rotate(2deg) translateY(4px)}
  .seal:nth-child(3){transform:rotate(-1.5deg)} .seal:nth-child(4){transform:rotate(3deg) translateY(3px)}
  .seal:nth-child(5){transform:rotate(-2.5deg)}
  .badges{position:absolute;left:40px;right:40px;bottom:56px;display:flex;gap:14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
  .b{padding:5px 9px;border:2px solid var(--accent);color:var(--accent)}
  .b.c{border-style:double;border-width:4px} .b.s{border-style:dashed}
  .tag{position:absolute;left:40px;bottom:26px;font-size:10px;letter-spacing:.16em;color:var(--soft)}
  .smudge{position:absolute;right:-30px;top:60px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(122,46,46,.10),rgba(122,46,46,0) 70%)}
</style>
<div class="cover">
  <div class="smudge"></div>
  <div class="frame"></div>
  <div class="file"><span>FILE NO. 1914</span><span>SECRET · BY HAND</span></div>
  <hr class="rule" style="top:62px">
  <h1>DISPATCHES</h1>
  <div class="year">1914</div>
  <div class="sub">FIVE HEADQUARTERS. ONE WAR.<br>EVERY ORDER IS YOURS TO GIVE,<br>AND THE RECORD WILL SAY WHAT FOLLOWED.</div>
  <div class="seals"><span class="seal">OHL</span><span class="seal">GQG</span><span class="seal">STAVKA</span><span class="seal">GHQ</span><span class="seal">AOK</span></div>
  <div class="badges"><span class="b">Settled record</span><span class="b c">Contested judgment</span><span class="b s">Speculative</span></div>
  <div class="tag">A WAR GAME FOR THE BROWSER</div>
</div>
