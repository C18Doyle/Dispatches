# Monthly dependency update pull requests, minor and patch versions only, grouped per folder so one
# folder produces at most one PR. Each PR runs the full CI (about 35 runner-minutes on Linux + Windows),
# so keep this quiet. Major versions (React 19, Tailwind 4, TypeScript 7...) are upgrades to plan by hand,
# one game at a time, with the baseline result in front of you; Dependabot is told to skip them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { all: { update-types: [minor, patch] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
  - package-ecosystem: npm
    directory: /Dispatches Frankenstein
    schedule: { interval: monthly }
