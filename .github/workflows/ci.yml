name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR replaces the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs run side by side, so a pull request waits for the slowest game (about 12 minutes) and not for the sum of them
# (about 33 minutes, which with the browser steps made a run 50 minutes). One job per game for its own test:fast, one for
# the tests that look across games, and one for the real-browser steps.
jobs:
  games:
    # Each game's test:fast. A pull request runs on Linux only; Windows also runs on every push to main, on a manual run,
    # and whenever someone dispatches it before a release (the repo was built on Windows, and most of the early breakage
    # was path and shell differences).
    name: ${{ matrix.game }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        game: ["Frankenstein", "1914", "1922", "1941", "1940", "Sherlock"]
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: node tools/run-all.mjs --install "${{ matrix.game }}"
      - run: node tools/run-all.mjs --fast "${{ matrix.game }}"

  shared:
    # The tests that look across games: the itch.json targets and the engine equivalence test.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: node tools/run-all.mjs --install
      - run: node tools/check-itch-config.mjs
      - run: node packages/engine/tests/campaign-equivalence.test.mjs

  browser:
    # Every built game in real Chromium and WebKit (phone and desktop, accessibility), the 1914 screens in each theme, and
    # a bot that plays each 1914 command, and each 1940 campaign, to its ending.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: node tools/run-all.mjs --install
      - name: Build every game
        run: |
          for g in "Dispatches Frankenstein" "Dispatches 1914" "Dispatches 1922" "Dispatches 1941" "Dispatches 1940" "Dispatches Sherlock"; do
            echo ">>> $g"
            if (cd "$g" && npm run | grep -q "build:nozip"); then (cd "$g" && npm run build:nozip); else (cd "$g" && npm run build); fi
          done
      - name: Install Chromium and WebKit
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Real-browser smoke test (Chromium + WebKit, accessibility)
        run: node tools/smoke-browser.mjs
      - name: Real-browser audit of the 1914 screens (themes, phone, accessibility)
        working-directory: Dispatches 1914
        env:
          BROWSERS: chromium,webkit
          THEMES: sepia,paper
        run: node tools/audit-screens.mjs
      - name: Real-browser playthrough of every 1914 command to its ending
        working-directory: Dispatches 1914
        run: node tools/playthrough.mjs
      - name: Real-browser playthrough of every 1940 campaign to its ending
        working-directory: Dispatches 1940
        run: node tools/playthrough.mjs
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: tests/browser-shots/
          if-no-files-found: ignore
          retention-days: 14

  # No slow tier at the moment: 1940's 48-run UI baseline (about 4 minutes on Linux) was the only slow test and
  # now runs in its test:fast like every other game's baseline. tools/run-all.mjs --slow still works if a game
  # defines a test:slow script again; add a `slow` job here when one does.
