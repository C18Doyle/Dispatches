name: release

# Push a tag named <game>-v<version> to publish that game, for example:
#   git tag 1941-v1.0.1 && git push origin 1941-v1.0.1
# <game> is one of: frankenstein, 1914, 1922, 1941, 1940. <version> must equal "version" in that game's package.json.
# A version with a suffix (1.2.3-rc.1) is a pre-release: it is built and attached to a GitHub pre-release but never pushed to itch.io.
# The job checks the release is ready (tools/release-check.mjs), runs the game's tests, builds, zips (npm run release), checks the zips load in Chromium exactly as itch.io
# would serve them, attaches them to a GitHub release, and, if itch.io is configured, pushes them with butler.
on:
  push:
    tags: ["frankenstein-v*", "1914-v*", "1922-v*", "1941-v*", "1940-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Work out the game and version from the tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          GAME="${TAG%%-v*}"
          VERSION="${TAG#*-v}"
          DIR=$(ls -d Dispatches\ */ | grep -i "$GAME" | head -1 | sed 's:/$::')
          [ -n "$DIR" ] || { echo "no game folder for $GAME"; exit 1; }
          PKG=$(node -p "require('./$DIR/package.json').version")
          [ "$PKG" = "$VERSION" ] || { echo "tag says $VERSION but $DIR/package.json says $PKG: bump package.json first"; exit 1; }
          echo "game=$GAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          # 1.2.3-rc.1 style versions are rehearsals/release candidates: GitHub pre-release, never pushed to itch.io
          case "$VERSION" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Check the release is ready (plain semver, changelog section)
        run: node tools/release-check.mjs "${{ steps.tag.outputs.game }}" ${{ steps.tag.outputs.pre == 'true' && '--allow-prerelease' || '' }}
      - name: Install
        working-directory: ${{ steps.tag.outputs.dir }}
        run: npm ci --no-audit --no-fund
      - name: Tests, build and zips
        working-directory: ${{ steps.tag.outputs.dir }}
        run: npm run release
      - name: Install Chromium and WebKit
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Check the zips load like itch.io serves them
        run: node tools/verify-release.mjs "${{ steps.tag.outputs.game }}" "${{ steps.tag.outputs.version }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="${{ steps.tag.outputs.dir }}/releases/${{ steps.tag.outputs.version }}"
          node tools/release-check.mjs "${{ steps.tag.outputs.game }}" --notes > release-notes.md
          gh release create "${GITHUB_REF_NAME}" "$DIR"/*.zip "$DIR/RELEASE.json" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md ${{ steps.tag.outputs.pre == 'true' && '--prerelease' || '' }}

      - name: itch.io (skipped until itch.json and BUTLER_API_KEY are set; never for pre-releases)
        if: steps.tag.outputs.pre != 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -n "$BUTLER_API_KEY" ]; then
            curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
            unzip -q butler.zip -d butler-bin && chmod +x butler-bin/butler
            export PATH="$PWD/butler-bin:$PATH"
          fi
          node tools/itch-push.mjs "${{ steps.tag.outputs.game }}" "${{ steps.tag.outputs.version }}"
